<!-- [LEARN-HTML] document structure; [WCAG22] native controls and labels.
     Neutral tokens are declared first in the adjacent CSS. Open this file locally. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Control states</title>
    <link rel="stylesheet" href="buttons.css" />
    <link rel="stylesheet" href="fields.css" />
    <link rel="stylesheet" href="layout.css" />
  </head>
  <body class="demo-panel">
    <main>
      <h1>Control states</h1>
      <p>
        Hover, press or Tab to a button. Marked previews also display each state
        without moving focus.
      </p>
      <div class="demo-row">
        <button class="demo-button" type="button">Default</button>
        <button class="demo-button" type="button" data-preview="hover">
          Hover
        </button>
        <button class="demo-button" type="button" data-preview="focus-visible">
          Focus-visible
        </button>
        <button class="demo-button" type="button" data-preview="active">
          Active
        </button>
        <button class="demo-button" type="button" disabled>Disabled</button>
        <button class="demo-button" type="button" disabled aria-busy="true">
          Loading…
        </button>
      </div>
      <div class="demo-field">
        <label for="sample-title">Item title</label>
        <input
          class="demo-input"
          id="sample-title"
          name="title"
          type="text"
          value=""
          readonly
          aria-invalid="true"
          aria-describedby="sample-error"
        />
        <p class="demo-error" id="sample-error">
          Error: enter a title. This read-only example shows a validation
          result.
        </p>
      </div>
      <label class="demo-switch"
        ><input type="checkbox" role="switch" name="compact" /> Compact
        layout</label
      >
    </main>
  </body>
</html>
